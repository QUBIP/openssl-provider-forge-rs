[package]
name = "openssl_provider_forge"
version = "0.10.1+dev"
edition = "2021"
description = "Rust crate with FFI binding for the `Core` and `Provider` APIs of `OpenSSL 3.2+`"
license = "Apache-2.0"
repository = "https://github.com/QUBIP/openssl-provider-forge-rs"
homepage = "https://qubip.eu"

[features]
default = ["zeroize-alloc"]

zeroize-alloc = ["zeroize/alloc"]

# Opt-in feature to regenerate the bindings (also requires setting OSSL_PROVIDER_FORGE_REGENERATE_BINDINGS)
regen = ["dep:bindgen", "dep:pkg-config"]

# To enable the nightly `doc(cfg(...))` badges on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = { version = "1.0", default-features = false }
bitflags = "2.13"
function_name = "0.3"
libc = { version = "0.2", default-features = false }
log = "0.4"
num-traits = { version = "0.2", default-features = false }
num_enum = { version = "0.7", default-features = false }
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
env_logger = "0.11"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
pkg-config = { version = "0.3", optional = true }
